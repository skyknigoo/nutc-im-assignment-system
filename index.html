<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NUTC 課程作業與報告繳交系統入口">
    <title>NUTC 課程繳交系統</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f4f8;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        main {
            width: 100%;
            max-width: 900px;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 40px);
        }

        header p {
            margin: 0;
            color: #64748b;
            font-size: 17px;
        }

        .systems {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 20px;
        }

        .system-card {
            display: flex;
            min-height: 220px;
            flex-direction: column;
            align-items: flex-start;
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .system-icon {
            margin-bottom: 16px;
            font-size: 32px;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .system-card p {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.6;
        }

        .system-link {
            margin-top: auto;
            padding: 11px 18px;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s;
        }

        .system-link:hover,
        .system-link:focus-visible {
            background: #125ca5;
        }

        .system-link:focus-visible {
            outline: 3px solid #90caf9;
            outline-offset: 3px;
        }

        .health .system-link {
            background: #0d9488;
        }

        .health .system-link:hover,
        .health .system-link:focus-visible {
            background: #0f766e;
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>NUTC 課程繳交系統</h1>
            <p>請選擇要使用的課程系統</p>
        </header>

        <section class="systems" aria-label="課程系統">
            <article class="system-card">
                <span class="system-icon" aria-hidden="true">📤</span>
                <h2>網路應用</h2>
                <p>上傳網路應用作業，或查看作業完成清單。</p>
                <a class="system-link" href="network-app.html">進入網路應用系統</a>
            </article>

            <article class="system-card health">
                <span class="system-icon" aria-hidden="true">🌿</span>
                <h2>健康人生</h2>
                <p>查看課堂報告列表，或上傳、更新短講報告。</p>
                <a class="system-link" href="hltsys.html">進入健康人生系統</a>
            </article>
        </section>
    </main>
</body>

</html>
